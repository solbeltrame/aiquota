name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ARCHS=arm64 scripts/build-app.sh
