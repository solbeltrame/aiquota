name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      # Ad-hoc signed. To sign and notarize, import a Developer ID certificate here and set SIGN_IDENTITY,
      # then run notarytool/stapler (see docs/DISTRIBUTION.md).
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Checksum
        run: cd dist && shasum -a 256 AIquota-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AIquota-*.zip dist/SHA256SUMS.txt \
            --draft --title "AIquota ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
